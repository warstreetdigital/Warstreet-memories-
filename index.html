<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>WarStreet Memories — Digital Memory Platform by WarStreet Experience Model™</title>
    <meta name="description" content="WarStreet Memories — A premium digital memory platform by WarStreet Experience Model™ connecting physical gifts to eternal digital keepsakes." />
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://warstreetmemories.enterharare.online/" />
    <meta property="og:title" content="WarStreet Memories — Digital Memory Platform" />
    <meta property="og:description" content="A premium digital memory platform by WarStreet Experience Model™ connecting physical gifts to eternal digital keepsakes." />
    
    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WarStreet Memories" />
    <meta name="twitter:description" content="Digital memory platform by WarStreet Experience Model™." />
    
    <!-- Google Fonts: Montserrat (Headings) & Poppins (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Core App Stylesheet (Pure Vanilla CSS) -->
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- App Shell Container (Optimized for Android and Mobile Viewports) -->
    <div class="app-shell">
      
      <!-- Compact App Header -->
      <header class="app-header" role="banner">
        <a href="/" class="brand-link" aria-label="WarStreet Memories Home">
          <div class="brand-monogram" aria-hidden="true">W</div>
          <div class="brand-titles">
            <span class="brand-title">WarStreet Memories</span>
            <span class="brand-subtitle">WarStreet Experience Model™</span>
          </div>
        </a>
        <div class="header-status-pill" title="Platform Architecture Target">
          Mobile App
        </div>
      </header>

      <!-- Main App Content -->
      <main class="app-main" id="main-content" role="main">

        <!-- ================================================================
             SCREEN 1: HOMEPAGE (CLEAN 2-COLUMN × 2-ROW CATEGORY GRID)
             ================================================================ -->
        <section id="view-home" class="app-view" aria-labelledby="home-view-heading">
          <div class="view-intro-bar">
            <h1 id="home-view-heading" class="view-label">Memory Categories</h1>
            <span class="view-hint">Tap to explore</span>
          </div>

          <!-- 2-Column × 2-Row Category Grid -->
          <div class="category-grid-2x2" role="region" aria-label="Memory Categories Grid">
            
            <!-- Category 1: Birthdays -->
            <a href="/birthdays/" class="category-btn-card" data-category-select="birthdays" aria-label="Birthdays Category (1 memory)">
              <div class="card-top-row">
                <div class="category-icon-box" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
                  </svg>
                </div>
                <svg class="category-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
              <div class="card-bottom-col">
                <h2 class="category-name-text">Birthdays</h2>
                <span class="category-meta-text has-memories">1 Memory</span>
              </div>
            </a>

            <!-- Category 2: Weddings -->
            <a href="/weddings/" class="category-btn-card" data-category-select="weddings" aria-label="Weddings Category (0 memories)">
              <div class="card-top-row">
                <div class="category-icon-box" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/>
                  </svg>
                </div>
                <svg class="category-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
              <div class="card-bottom-col">
                <h2 class="category-name-text">Weddings</h2>
                <span class="category-meta-text">0 Memories</span>
              </div>
            </a>

            <!-- Category 3: Roora -->
            <a href="/roora/" class="category-btn-card" data-category-select="roora" aria-label="Roora Category (0 memories)">
              <div class="card-top-row">
                <div class="category-icon-box" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
                  </svg>
                </div>
                <svg class="category-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
              <div class="card-bottom-col">
                <h2 class="category-name-text">Roora</h2>
                <span class="category-meta-text">0 Memories</span>
              </div>
            </a>

            <!-- Category 4: Love & Family -->
            <a href="/love-family/" class="category-btn-card" data-category-select="love-family" aria-label="Love & Family Category (0 memories)">
              <div class="card-top-row">
                <div class="category-icon-box" aria-hidden="true">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                  </svg>
                </div>
                <svg class="category-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </div>
              <div class="card-bottom-col">
                <h2 class="category-name-text">Love &amp; Family</h2>
                <span class="category-meta-text">0 Memories</span>
              </div>
            </a>

          </div>
        </section>

        <!-- ================================================================
             SCREEN 2: DEDICATED CATEGORY SCREEN (APP-LIKE TRANSITION)
             ================================================================ -->
        <section id="view-category" class="app-view" hidden aria-live="polite">
          <div class="category-screen-header">
            <button type="button" id="btn-back-to-home" class="nav-back-button" aria-label="Return to all categories">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 18-6-6 6-6"/>
              </svg>
              <span>Categories</span>
            </button>
            <div id="category-header-mount"></div>
          </div>

          <div id="category-content-mount"></div>
        </section>

      </main>

      <!-- Compact App Footer -->
      <footer class="app-footer" role="contentinfo">
        <div class="footer-model-signature">
          Powered by <span>WarStreet Experience Model™</span>
        </div>
        <div class="footer-domain-note">
          warstreetmemories.enterharare.online
        </div>
      </footer>

    </div>

    <!-- Scripts: Pure Vanilla Data & Interaction Controller -->
    <script src="/js/data.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
